name: Release

# Окрема програма Nx IDE: при пуші тегу vX.Y.Z збирається nx (з NyxilumLang)
# разом з IDE в одну теку програми й пакується:
#   Windows - NxIDE-win-x64-setup.exe (Inno Setup) і .zip; "Nx IDE.exe" -
#             запускач без вікна консолі (NativeAOT, launcher/);
#   Linux   - NxIDE-linux-x64.deb і .tar.gz (для install.sh).
# Поруч з nx лежить nx-ide.json - за ним IDE знає, що вона окрема програма,
# і оновлюється з релізів цього репозиторію (nx update-self --repo ...).
# macOS - поки нема: полотно IDE працює через X11, якого на Mac без
# XQuartz нема.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create (or reuse) GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Реліз ${{ github.ref_name }} уже існує"
          else
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Nx IDE ${{ github.ref_name }}" --generate-notes
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            tfm: net10.0-windows
            exe: Nx.exe
          - os: ubuntu-latest
            rid: linux-x64
            tfm: net10.0
            exe: Nx
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: NyxilumIDE

      - uses: actions/checkout@v4
        with:
          repository: Faneraiy14/NyxilumLang
          path: NyxilumLang

      - uses: actions/checkout@v4
        with:
          repository: Faneraiy14/NyxilumDb
          path: NyxilumDb

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Версія з тегу
        id: version
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Зібрати nx (self-contained, один файл)
        working-directory: NyxilumLang
        run: >
          dotnet publish src/NyxilumLang -c Release
          -r ${{ matrix.rid }} -f ${{ matrix.tfm }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:EnableWindowsTargeting=true
          -p:DebugType=None
          -p:Version=${{ steps.version.outputs.number }}
          -o ../app

      # тека програми: nx, lib, ide (src/examples/extensions/assets), nx-ide.json
      - name: Скласти теку програми
        shell: bash
        run: |
          cp -r NyxilumLang/lib app/lib
          mkdir -p app/ide
          cp -r NyxilumIDE/src NyxilumIDE/examples NyxilumIDE/extensions NyxilumIDE/assets app/ide/
          rm -rf app/ide/examples/.gen
          cp NyxilumIDE/README.md NyxilumIDE/README.en.md NyxilumIDE/ПОСІБНИК.md NyxilumIDE/GUIDE.md NyxilumIDE/LICENSE app/ide/
          cp NyxilumIDE/LICENSE app/
          sed -i 's/^var IDE_VERSION = .*/var IDE_VERSION = "${{ steps.version.outputs.number }}"/' app/ide/src/version.nx
          printf '{"app": "nx-ide", "version": "%s", "repo": "Faneraiy14/NyxilumIDE"}\n' "${{ steps.version.outputs.number }}" > app/nx-ide.json
          grep IDE_VERSION app/ide/src/version.nx

      - name: Запускач «Nx IDE.exe» (Windows, NativeAOT)
        if: matrix.rid == 'win-x64'
        run: dotnet publish NyxilumIDE/launcher -c Release -r win-x64 -p:PublishAot=true -p:Version=${{ steps.version.outputs.number }} -o app

      - name: Пакети (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Remove-Item app\*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path app/* -DestinationPath NxIDE-win-x64.zip
          choco install innosetup --no-progress -y | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyVersion=${{ steps.version.outputs.number }}" "/DSrcDir=$PWD\app" "/O$PWD" NyxilumIDE\packaging\nxide.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: код $LASTEXITCODE" }

      - name: Пакети (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          chmod +x app/Nx
          tar -czf NxIDE-linux-x64.tar.gz -C app .
          bash NyxilumIDE/packaging/build-deb.sh app "${{ steps.version.outputs.number }}" NxIDE-linux-x64.deb

      - name: Завантажити в реліз
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls NxIDE-* 2>/dev/null)
          echo "$files"
          gh release upload "${{ github.ref_name }}" $files --repo "${{ github.repository }}" --clobber
